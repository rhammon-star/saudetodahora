<!DOCTYPE html><html lang="pt-BR"><head><title>Sobre | Saúde Toda Hora</title><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg:#faf9f6; --bg-alt:#f3f1e8; --green:#2d8659; --green-deep:#1f5f3f; --sand:#d4b896; --text:#1f2937; --muted:#6b7280; --line:#e7e5dc; }
body { font-family: 'Source Sans 3', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.75; font-size: 17px; -webkit-font-smoothing: antialiased; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 28px; }
.container-narrow { max-width: 700px; margin: 0 auto; padding: 0 28px; }
nav.site { padding: 26px 0; border-bottom: 1px solid var(--line); }

.hero { padding: 96px 0 72px; }

.hero .eyebrow { font-family: 'Source Sans 3', system-ui, sans-serif; text-transform: uppercase; letter-spacing: 4px; font-size: 0.78rem; color: var(--green); font-weight: 600; margin-bottom: 22px; }
.hero h1 { font-family: 'Playfair Display', serif; font-size: 3.4rem; font-weight: 600; line-height: 1.1; color: var(--text); letter-spacing: -1.5px; margin-bottom: 28px; }

section { padding: 80px 0; }

.post-card { text-decoration: none; color: inherit; display: block; transition: transform 0.25s; }
.post-card:hover { transform: translateY(-3px); }

.post-card:first-child .img { aspect-ratio: 4/5; }
.post-card .img::after { content: attr(data-symbol); position: absolute; bottom: 18px; right: 22px; font-family: 'Playfair Display', serif; font-style: italic; color: rgba(255,255,255,0.7); font-size: 2.4rem; }
.post-card .tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 2.5px; color: var(--green); font-weight: 600; margin-bottom: 10px; }

footer.site a { color: var(--muted); text-decoration: none; display: block; padding: 5px 0; font-size: 0.92rem; }

article.post .tag { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 2.5px; color: var(--green); font-weight: 600; margin-bottom: 18px; display: block; }
article.post h1 { font-family: 'Playfair Display', serif; font-size: 2.6rem; color: var(--text); font-weight: 600; line-height: 1.18; letter-spacing: -0.8px; margin-bottom: 24px; }
article.post .meta { font-family: 'Playfair Display', serif; font-style: italic; color: var(--muted); font-size: 1rem; margin-bottom: 44px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
article.post .content > p:first-of-type::first-letter { font-family: 'Playfair Display', serif; font-size: 4.5rem; float: left; line-height: 0.85; margin: 6px 12px 0 0; color: var(--green); font-weight: 600; }
article.post .content h2 { font-family: 'Playfair Display', serif; font-size: 1.65rem; color: var(--text); margin: 48px 0 18px; font-weight: 600; letter-spacing: -0.3px; }
article.post .content p { margin: 0 0 22px; color: #2d3748; font-size: 1.08rem; line-height: 1.8; }
article.post .content a { color: var(--green); text-decoration: none; border-bottom: 1px solid rgba(45,134,89,0.35); }
article.post .content a:hover { border-bottom-color: var(--green); }
.back-link { display: inline-block; margin-top: 48px; color: var(--muted); font-size: 0.92rem; text-decoration: none; }
.back-link:hover { color: var(--green); }
@media (max-width: 800px) {
  .hero .container { grid-template-columns: 1fr; gap: 36px; }
  .hero h1 { font-size: 2.1rem; }
  .posts-grid { grid-template-columns: 1fr; }
  .posts-grid .post-card:first-child { grid-row: auto; }
  .post-card:first-child h3 { font-size: 1.3rem; }
  footer.site .container { grid-template-columns: 1fr; gap: 28px; }
  article.post h1 { font-size: 1.8rem; }
  section { padding: 56px 0; }
}
